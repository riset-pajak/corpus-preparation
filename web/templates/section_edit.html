{% extends "base.html" %}
{% block title %}Edit Section - {{ reg_identifier[:40] }} - CorpusPrep{% endblock %}
{% block content %}
<h2>Edit Section</h2>
<p class="section-ref">Regulasi: <a href="/regulation/{{ section.regulation_id }}">{{ reg_identifier }}</a></p>

<form method="post" class="edit-form">
  <div class="form-group">
    <label for="section_number">Nomor Section (Pasal/Ayat)</label>
    <input type="text" id="section_number" name="section_number" value="{{ section.section_number }}" required>
  </div>

  <div class="form-group">
    <label for="section_title">Judul Section</label>
    <input type="text" id="section_title" name="section_title" value="{{ section.section_title }}">
  </div>

  <div class="form-group">
    <label for="text">Teks (Cleaned)</label>
    <textarea id="text" name="text" rows="15">{{ section.text }}</textarea>
  </div>

  <div class="form-group">
    <label for="raw_text">Raw Text (Asli PDF)</label>
    <textarea id="raw_text" name="raw_text" rows="10">{{ section.raw_text }}</textarea>
  </div>

  <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
  <a href="/regulation/{{ section.regulation_id }}" class="btn">Batal</a>
</form>
{% endblock %}
